services:
  # ===========================
  # AI Agent 后端服务（FastAPI）
  # ===========================
  agent:
    build: .                      # 使用当前目录下的 Dockerfile 构建镜像
    platform: linux/amd64         # 指定运行平台，避免 ARM/Mac 兼容问题
    restart: unless-stopped       # 容器异常退出自动重启，手动停止除外

    # 挂载数据卷，实现数据持久化
    volumes:
      - ./data:/data              # 保存业务数据
      - ./logs:/logs              # 保存日志文件
      - ./src:/src                # 源码挂载，修改本地文件无需重建镜像（开发用）
      - ./hf_cache:/root/.cache/huggingface  # HuggingFace 模型缓存（BGE reranker）
      - ./fastembed_cache:/tmp/fastembed_cache  # FastEmbed 模型缓存（BM25 稀疏检索）

    # 依赖服务，启动前等待数据库和向量库可用
    depends_on:
      qdrant:
        condition: service_healthy
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy

    # 映射宿主机端口 -> 容器端口
    ports:
      - "8001:8001"

    # 开发模式：覆盖启动命令，启用热重载（修改源码自动重启）
    command: uv run uvicorn src.agent.main:app --host 0.0.0.0 --port 8001 --reload

    # 加载环境变量文件
    env_file:
      - .env

    # 覆盖或补充环境变量
    environment:
      - QDRANT_URL=http://qdrant
      # MySQL 数据库连接地址（使用专用账号，密码从 .env 读取，不入库）
      - DATABASE_URL=mysql+aiomysql://${MYSQL_USER:-fitness_app}:${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}@mysql:3306/fitness_agent
      # Phoenix 链路追踪地址
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
      # 会话状态存储：postgres 持久化（重启/崩溃后可恢复暂停中的确认任务）
      - CHECKPOINT_BACKEND=postgres
      - POSTGRES_DSN=postgresql://fitness:fitness@postgres:5432/fitness_agent
      # HuggingFace Hub 离线模式 — 只读缓存不联网（容器内无法访问 huggingface.co）
      - HF_HUB_OFFLINE=1

  # ===========================
  # React 前端页面（nginx 托管构建产物 + 反向代理后端）
  # ===========================
  web:
    build:
      context: .                  # 构建上下文
      dockerfile: Dockerfile.frontend  # 使用前端专用 Dockerfile
    platform: linux/amd64

    # 前端依赖后端服务
    depends_on:
      - agent

    ports:
      - "5173:80"                 # 浏览器访问端口（对齐本地 vite dev 的端口）

    # 不挂载源码：构建产物是静态文件，改代码要重新 build。
    # 本地开发用 `make start_frontend`（vite dev server 带 HMR）。

  # ===========================
  # MySQL 8.4 数据库
  # ===========================
  mysql:
    image: mysql:8.4
    container_name: fitness_mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fitness_agent
      # 应用专用账号；首次初始化数据卷时由镜像自动创建并授权本库
      MYSQL_USER: ${MYSQL_USER:-fitness_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}

    ports:
      # 只绑定本机，避免数据库端口暴露到局域网/公网
      - "127.0.0.1:3307:3306"

    # 数据持久化目录
    volumes:
      - ./mysql_data:/var/lib/mysql

    # 健康检查，确保数据库已启动
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================
  # Postgres —— LangGraph checkpoint 会话状态存储
  # ===========================
  # 为什么单独起一个 PG 而不是复用 MySQL：LangGraph 的 PostgresSaver 依赖
  # psycopg 与 jsonb，官方只维护 PG 实现；MySQL 只存业务数据，职责分离。
  postgres:
    image: postgres:16-alpine
    container_name: fitness_postgres
    environment:
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: fitness
      POSTGRES_DB: fitness_agent
    ports:
      # 宿主 5433，避免和本机已装的 Postgres 撞端口；只绑定本机
      - "127.0.0.1:5433:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness -d fitness_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================
  # Qdrant 向量数据库
  # ===========================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant

    # 指定配置文件启动
    command: ["./qdrant", "--config-path", "config/qdrant.yaml"]

    volumes:
      # 向量数据持久化
      - ./vector_db:/qdrant/storage

      # 挂载自定义配置文件
      - ./config/qdrant.yaml:/qdrant/config/qdrant.yaml

    ports:
      - "127.0.0.1:6333:6333"   # REST API
      - "127.0.0.1:6334:6334"   # gRPC API

    # 日志轮换配置
    logging:
      driver: "json-file"
      options:
        max-file: "1"      # 最多保留 1 个日志文件
        max-size: "10m"    # 单个日志最大 10MB

    # 容器资源限制
    deploy:
      resources:
        limits:
          memory: 2Gb

    # 健康检查接口。
    # 注意：qdrant 镜像内没有 curl/wget，改用 bash 的 /dev/tcp 探测 6333 端口。
    # 端口在 collection 全部加载完成后才绑定，因此端口可连通 = 服务就绪。
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ===========================
  # Phoenix 链路追踪与可观测平台
  # ===========================
  phoenix:
    image: arizephoenix/phoenix:latest
    # 建议版本 > 4.0，支持 OpenTelemetry Trace

    ports:
      - "6006:6006"   # Phoenix Web UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      # - "9090:9090" # 可选：Prometheus 监控端口

    environment:
      # Phoenix 工作目录
      - PHOENIX_WORKING_DIR=/mnt/data

    volumes:
      # 持久化 Phoenix 数据
      - ./phoenix_data:/mnt/data
