upstream backend {
    server agent:8001;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA：所有前端路由都回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------------
    # 后端三个前缀反向代理 —— 前端因此始终同源请求，后端不需要 CORS 中间件。
    # ------------------------------------------------------------------
    location ~ ^/(chat|workout|documents) {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # /chat/stream 推的是 NDJSON。nginx 默认会缓冲上游响应，
        # 那样整段回答会攒到流结束才一次性吐给浏览器，流式效果完全失效。
        proxy_buffering off;
        proxy_cache off;

        # Agent 一轮对话可能跑几分钟（工具调用 + LLM），嵌入大文档更久。
        # 默认 60s 会把长请求掐断。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 上传大文档
        client_max_body_size 100m;
    }
}
